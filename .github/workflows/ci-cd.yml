# Имя нашего конвейера, которое будет отображаться в интерфейсе
name: CI/CD Pipeline

# ТРИГГЕРЫ: Когда запускать конвейер?
on:
  push:
    branches: [ "main" ] # При пуше в главную ветку
  pull_request:
    branches: [ "main" ] # При создании пулл-реквеста

# ЗАДАЧИ (JOBS): Что именно делать?
jobs:
  # Задача 1: Непрерывная интеграция и тестирование (CI)
  test:
    runs-on: ubuntu-latest # На какой ОС крутим (виртуальная машина GitHub)
    steps:
      # 1. Скачиваем наш код из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Устанавливаем Python в окружение
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Устанавливаем зависимости (pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. НЕПРЕРЫВНОЕ ТЕСТИРОВАНИЕ: Запускаем тесты
      # Если тесты упадут, конвейер остановится и не пойдет дальше!
      - name: Run tests
        run: pytest test_main.py

  # Задача 2: Непрерывная поставка и сборка (CD)
  build-and-push:
    # Эта задача запустится ТОЛЬКО если задача 'test' успешно завершилась
    needs: test 
    runs-on: ubuntu-latest
    # Запускаем только если это был пуш в main, а не просто pull request
    if: github.event_name == 'push' 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 5. СБОРКА И УПАКОВКА: Собираем Docker-образ
      - name: Build Docker image
        run: docker build -t my-app:latest .

      # 6. РАЗВЕРТЫВАНИЕ (в хранилище артефактов):
      # Чтобы отправить образ в DockerHub, нужно добавить секреты в настройки GitHub!
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push my-app:latest
